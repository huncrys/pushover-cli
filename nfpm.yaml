# yaml-language-server: $schema=https://nfpm.goreleaser.com/static/schema.json
name: pushover-cli
arch: all
platform: linux
version: $VERSION
section: misc
priority: optional
depends:
  - curl
maintainer: Kristof Bach <crys@crys.hu>
description: |
  Pushover CLI is a tool to send Pushover notifications from the command line
  It supports sending messages, images, and files to Pushover users and groups.
vendor: Crys
homepage: https://oaklab.hu/crys/pushover-cli
changelog: dist/changelog.yaml
contents:
  - src: ./pushover
    dst: /usr/bin/pushover
    file_info:
      mode: 0755
  - src: debian/copyright
    dst: /usr/share/doc/pushover-cli/copyright
    file_info:
      mode: 0644
  - src: debian/.lintian-overrides
    dst: /usr/share/lintian/overrides/pushover-cli
    packager: deb
    file_info:
      mode: 0644
